name: Release (signed by SignPath)

# 触发方式：推 tag（v*）或手动运行
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 v2.2.3'
        required: true

# SignPath 需要读取本仓库的 workflow 产物（artifact），发布需要写 Release
permissions:
  contents: write
  actions: read

jobs:
  build-and-sign:
    # SignPath Foundation 要求：OSS 项目的所有 job 必须跑在 GitHub 托管的 runner 上
    runs-on: windows-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 构建（Release / win-x64 / 框架依赖）
        run: >
          dotnet publish DarkMode.Ui/DarkMode.Ui.csproj
          -c Release -r win-x64 -p:Platform=x64
          --self-contained false -p:PublishAot=false
          -o publish

      - name: 打包（不含运行日志）
        shell: pwsh
        run: |
          Remove-Item publish/logs -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/* -DestinationPath "$env:RUNNER_TEMP/DarkMode2-$env:VERSION-unsigned.zip"

      # SignPath 只接受"已作为 GitHub workflow artifact 存在"的文件
      - name: 上传未签名产物
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkMode2-unsigned
          path: ${{ runner.temp }}/DarkMode2-${{ env.VERSION }}-unsigned.zip
          if-no-files-found: error

      - name: 向 SignPath 提交签名请求
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: darkmode2-refactor
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: 整理已签名产物
        shell: pwsh
        run: |
          # SignPath 按 Artifact Configuration 回传（zip 根元素 => 回传一个 zip）
          $signedFile = Get-ChildItem signed -Recurse -File | Select-Object -First 1
          Copy-Item $signedFile.FullName "DarkMode2-$env:VERSION-win-x64-signed.zip"
          Get-ChildItem "DarkMode2-$env:VERSION-win-x64-signed.zip" | Format-List Name,Length

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: DarkMode2-*-win-x64-signed.zip
          name: ${{ env.VERSION }}
          generate_release_notes: true
